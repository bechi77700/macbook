<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="154mm" height="111mm"
     viewBox="0 0 154 111"
     version="1.1">
  <!--
    CARTE 1 - RECTO : Logo EverHaar
    Format final : 148 x 105 mm (A6 paysage)
    Fond perdu : 3mm de chaque cote

    NOTE FOURNISSEUR : Remplacer le texte "EverHaar" et "HAIR CARE"
    par le fichier logo vectoriel officiel de la marque.
    Le texte ci-dessous sert de positionnement/reference.
  -->

  <!-- Fond noir avec fond perdu -->
  <rect x="0" y="0" width="154" height="111" fill="#000000"/>

  <!-- Reperes de coupe -->
  <g stroke="#FFFFFF" stroke-width="0.15" fill="none" opacity="0.6">
    <line x1="3" y1="0" x2="3" y2="1.5"/>
    <line x1="3" y1="109.5" x2="3" y2="111"/>
    <line x1="151" y1="0" x2="151" y2="1.5"/>
    <line x1="151" y1="109.5" x2="151" y2="111"/>
    <line x1="0" y1="3" x2="1.5" y2="3"/>
    <line x1="152.5" y1="3" x2="154" y2="3"/>
    <line x1="0" y1="108" x2="1.5" y2="108"/>
    <line x1="152.5" y1="108" x2="154" y2="108"/>
  </g>

  <!-- LOGO EVERHAAR - Centre de la carte -->
  <!-- Police : fine, elegante, type Didot/Bodoni thin -->
  <!-- Le "E" et "H" majuscules, "ver" et "aar" en minuscules -->
  <text x="77" y="50"
        font-family="'Didot', 'Bodoni MT', 'Bodoni 72', 'GFS Didot', 'Cormorant Garamond', 'Playfair Display', serif"
        font-size="26"
        font-weight="300"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="0.5">EverHaar</text>

  <!-- Sous-titre "HAIR CARE" - espacement large, poids light -->
  <text x="77" y="59"
        font-family="'Helvetica Neue', 'Futura', 'Arial', sans-serif"
        font-size="4.5"
        font-weight="300"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="5">HAIR CARE</text>

</svg>